http {
    upstream logistics_backend {
        server logistics.company.com max_fails=5 fail_timeout=30s;
    }

    server {
        listen 8080;

        error_page 502 504 = /fallback-logistics;

        location /logistics/ {
            proxy_pass http://logistics_backend;

            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;

            proxy_next_upstream error timeout invalid_header http_502 http_504;
        }

        location /fallback-logistics {
            default_type application/json;
            return 200 '{"status":"degraded","message":"Logistics service temporarily unavailable"}';
        }
    }
}